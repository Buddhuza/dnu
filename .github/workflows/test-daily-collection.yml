name: Collect native DNU draft at 01:00 and 13:00 Vienna

on:
  schedule:
    # Winter and summer UTC candidates; the Vienna-hour guard selects one.
    - cron: '0 23 * * *'
    - cron: '0 0 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-daily-collection.yml

permissions:
  contents: write

concurrency:
  group: native-draft-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check Vienna collection time
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != schedule ] || node --input-type=module -e "import { isScheduledUtcCandidate } from './collector/slots.js'; process.exit(isScheduledUtcCandidate(process.env.CRON_SCHEDULE) ? 0 : 1)"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.slot.outputs.run == 'true'
        with:
          node-version: '24.5.0'
          cache: npm
      - if: steps.slot.outputs.run == 'true'
        run: npm ci
      - name: Collect completed JSON from publishers
        if: steps.slot.outputs.run == 'true'
        run: npm run collect:daily
      - name: Save draft and route audit
        if: always() && steps.slot.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-daily-draft
          path: |
            data/prepared-update.json
            data/native-collection-progress.json
          if-no-files-found: warn
          retention-days: 7
      - name: Make completed draft available to the editor on GitHub Pages
        if: steps.slot.outputs.run == 'true' && success()
        run: |
          set -e
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add /tmp/dnu-native-draft-pages origin/gh-pages
          cp data/prepared-update.json /tmp/dnu-native-draft-pages/native-draft.json
          node scripts/write-native-draft-status.mjs data/prepared-update.json /tmp/dnu-native-draft-pages/native-draft-status.json
          git -C /tmp/dnu-native-draft-pages config user.name "github-actions[bot]"
          git -C /tmp/dnu-native-draft-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/dnu-native-draft-pages add native-draft.json native-draft-status.json
          git -C /tmp/dnu-native-draft-pages commit -m "Save native DNU review draft for run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            if git -C /tmp/dnu-native-draft-pages push origin HEAD:gh-pages; then exit 0; fi
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git -C /tmp/dnu-native-draft-pages rebase origin/gh-pages
            sleep $((attempt * 3))
          done
          exit 1
