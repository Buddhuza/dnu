name: Test daily native collection (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          cache: npm
      - run: npm ci
      - name: Collect completed JSON from publishers
        run: npm run collect:daily
      - name: Save draft and route audit
        uses: actions/upload-artifact@v4
        with:
          name: native-daily-draft
          path: data/prepared-update.json
          retention-days: 7
