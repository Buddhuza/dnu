name: Collect native DNU draft at 07:00 and 19:00 Vienna

on:
  schedule:
    # Winter and summer UTC candidates; the Vienna-hour guard selects one.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    # Recovery check; it collects only when the current Vienna slot has no completed draft.
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      scheduled_recovery:
        description: Reserved for the Supabase scheduler
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/dnu-catchup-trigger.txt]

permissions:
  contents: write

concurrency:
  group: native-draft-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ran: ${{ steps.slot.outputs.run }}
      record_skip: ${{ steps.slot.outputs.record_skip }}
      scheduled_slot: ${{ steps.slot.outputs.scheduled_slot }}
    steps:
      - uses: actions/checkout@v5
      - name: Check Vienna collection time
        id: slot
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          SCHEDULED_RECOVERY: ${{ inputs.scheduled_recovery }}
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git show origin/gh-pages:native-draft-status.json > /tmp/dnu-latest-draft-status.json || true
          node scripts/collection-slot-decision.mjs /tmp/dnu-latest-draft-status.json
      - uses: actions/setup-node@v5
        if: steps.slot.outputs.run == 'true'
        with:
          node-version: '24.5.0'
          cache: npm
      - if: steps.slot.outputs.run == 'true'
        run: npm ci
      - name: Collect completed JSON from publishers
        if: steps.slot.outputs.run == 'true'
        env:
          DNU_COLLECTION_TRIGGER: ${{ (github.event_name == 'schedule' || inputs.scheduled_recovery == true) && 'automatic' || 'manual' }}
        run: npm run collect:daily
      - name: Save draft and route audit
        if: always() && steps.slot.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-daily-draft
          path: |
            data/prepared-update.json
            data/native-collection-progress.json
          if-no-files-found: warn
          retention-days: 7
      - name: Make completed draft available to the editor on GitHub Pages
        if: steps.slot.outputs.run == 'true' && success()
        env:
          DNU_SCHEDULED_SLOT: ${{ steps.slot.outputs.scheduled_slot }}
          DNU_COLLECTION_TRIGGER: ${{ (github.event_name == 'schedule' || inputs.scheduled_recovery == true) && 'automatic' || 'manual' }}
        run: |
          set -e
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add /tmp/dnu-native-draft-pages origin/gh-pages
          cp data/prepared-update.json /tmp/dnu-native-draft-pages/native-draft.json
          node scripts/write-native-draft-status.mjs data/prepared-update.json /tmp/dnu-native-draft-pages/native-draft-status.json
          git -C /tmp/dnu-native-draft-pages config user.name "github-actions[bot]"
          git -C /tmp/dnu-native-draft-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/dnu-native-draft-pages add native-draft.json native-draft-status.json
          git -C /tmp/dnu-native-draft-pages commit -m "Save native DNU review draft for run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            if git -C /tmp/dnu-native-draft-pages push origin HEAD:gh-pages; then exit 0; fi
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git -C /tmp/dnu-native-draft-pages rebase origin/gh-pages
            sleep $((attempt * 3))
          done
          exit 1

  report:
    if: always() && (needs.collect.outputs.ran == 'true' || needs.collect.outputs.record_skip == 'true' || needs.collect.result == 'failure' || needs.collect.result == 'cancelled')
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Download collection results if available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: native-daily-draft
          path: report-data
      - name: Record scrape in site log
        env:
          DNU_COLLECTION_RESULT: ${{ needs.collect.result }}
          DNU_COLLECTION_SKIPPED: ${{ needs.collect.outputs.record_skip }}
          DNU_COLLECTION_SLOT: ${{ needs.collect.outputs.scheduled_slot }}
          DNU_COLLECTION_TRIGGER: ${{ (github.event_name == 'schedule' || inputs.scheduled_recovery == true) && 'automatic' || 'manual' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add --detach /tmp/dnu-scrape-log-pages origin/gh-pages
            node scripts/write-native-collection-log.mjs report-data /tmp/dnu-scrape-log-pages/native-collection-log.json
            git -C /tmp/dnu-scrape-log-pages add native-collection-log.json
            git -C /tmp/dnu-scrape-log-pages commit -m "Record DNU scrape ${{ github.run_id }}"
            if git -C /tmp/dnu-scrape-log-pages push origin HEAD:gh-pages; then exit 0; fi
            git worktree remove --force /tmp/dnu-scrape-log-pages
            sleep $((attempt * 3))
          done
          exit 1
      - name: Email scrape report
        if: always() && (needs.collect.outputs.ran == 'true' || needs.collect.result == 'failure' || needs.collect.result == 'cancelled')
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DNU_SCRAPE_RESULT: ${{ needs.collect.result }}
          DNU_SCRAPE_KIND: daily
        run: python3 scripts/send-collection-report.py report-data
