name: AUTOSEND latest completed DNU scrape

# Run only after the owner explicitly requests AUTOSEND.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/dnu-autosend-trigger.txt

permissions:
  contents: read

concurrency:
  group: dnu-autosend
  cancel-in-progress: false

jobs:
  autosend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          cache: npm
      - run: npm ci
      - name: Verify Gmail and Supabase credentials
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: test -n "$GMAIL_APP_PASSWORD" && { test -n "$SUPABASE_SERVICE_ROLE_KEY" || test -n "$SUPABASE_ACCESS_TOKEN"; }
      - name: Read the latest completed scrape
        run: |
          git fetch origin gh-pages
          git show FETCH_HEAD:native-draft.json > "$RUNNER_TEMP/native-draft.json"
          git show FETCH_HEAD:native-draft-status.json > "$RUNNER_TEMP/native-draft-status.json"
      - name: Clear old stories and publish the latest scrape
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/autosend.mjs "$RUNNER_TEMP/native-draft.json" "$RUNNER_TEMP/native-draft-status.json" "$RUNNER_TEMP/dnu-gmail-message.json"
      - name: Send the published edition to the saved address book
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/send-dnu-gmail.py "$RUNNER_TEMP/dnu-gmail-message.json"
