name: Weekend DNU collection draft (manual until approved)

# Add a schedule only after the native collector and publication plan are reviewed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.5.0'
          cache: npm
      - run: npm ci
      - name: Collect weekend draft from publishers
        run: bash scripts/retry-collection.sh
      - name: Save JSON for editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekend-native-draft
          path: |
            data/prepared-update.json
            data/native-collection-progress.json
          if-no-files-found: warn
          retention-days: 7

  report:
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Download collection results if available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: weekend-native-draft
          path: report-data
      - name: Email scrape report
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DNU_SCRAPE_RESULT: ${{ needs.collect.result }}
          DNU_SCRAPE_KIND: weekend
        run: python3 scripts/send-collection-report.py report-data
