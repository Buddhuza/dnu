name: Weekend DNU collection draft (manual until approved)

# Add a schedule only after the native collector and publication plan are reviewed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          cache: npm
      - run: npm ci
      - name: Collect weekend draft from publishers
        run: npm run collect:daily
      - name: Save JSON for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: weekend-native-draft
          path: data/prepared-update.json
          retention-days: 7
