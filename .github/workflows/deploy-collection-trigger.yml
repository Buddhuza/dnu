name: Deploy one-click DNU scrape trigger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-collection-trigger.yml
      - supabase/functions/start-dnu-collection/index.ts
      - supabase/functions/send-dnu-email/index.ts
      - supabase/functions/schedule-dnu-email/index.ts
      - supabase/functions/schedule-dnu-autosend/index.ts
      - supabase/functions/schedule-dnu-collection/index.ts

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
      - name: Verify Supabase access token is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Verify DNU workflow token is configured
        env:
          DNU_WORKFLOW_TOKEN: ${{ secrets.DNU_WORKFLOW_TOKEN }}
        run: test -n "$DNU_WORKFLOW_TOKEN"
      - name: Verify Supabase token can access the DNU project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          status=$(curl -sS -o "$RUNNER_TEMP/dnu-project-response" -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects/epghsyajgspcywqqbfso)
          if [ "$status" != 200 ]; then
            echo "::error::Supabase access token cannot read the DNU project (HTTP $status)"
            exit 1
          fi
      - name: Store GitHub workflow token in Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DNU_WORKFLOW_TOKEN: ${{ secrets.DNU_WORKFLOW_TOKEN }}
        run: |
          secret_file="$RUNNER_TEMP/dnu-function-secret.json"
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify([{name:"GITHUB_WORKFLOW_TOKEN",value:process.env.DNU_WORKFLOW_TOKEN}]), {mode:0o600})' "$secret_file"
          status=$(curl -sS -o "$RUNNER_TEMP/dnu-secret-response" -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$secret_file" \
            https://api.supabase.com/v1/projects/epghsyajgspcywqqbfso/secrets)
          rm -f "$secret_file"
          if [ "$status" != 200 ] && [ "$status" != 201 ] && [ "$status" != 204 ]; then
            echo "::error::Supabase could not store the function secret (HTTP $status)"
            exit 1
          fi
      - name: Deploy editor-only trigger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@2.58.0 functions deploy start-dnu-collection --project-ref epghsyajgspcywqqbfso
      - name: Deploy editor Gmail trigger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@2.58.0 functions deploy send-dnu-email --project-ref epghsyajgspcywqqbfso
      - name: Deploy scheduled Gmail trigger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@2.58.0 functions deploy schedule-dnu-email --no-verify-jwt --project-ref epghsyajgspcywqqbfso
      - name: Deploy scheduled AUTOSEND recovery
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@2.58.0 functions deploy schedule-dnu-autosend --no-verify-jwt --project-ref epghsyajgspcywqqbfso
      - name: Deploy scheduled collection recovery trigger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@2.58.0 functions deploy schedule-dnu-collection --no-verify-jwt --project-ref epghsyajgspcywqqbfso
