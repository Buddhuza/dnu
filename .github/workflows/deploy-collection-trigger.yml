name: Deploy one-click DNU scrape trigger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-collection-trigger.yml
      - supabase/functions/start-dnu-collection/index.ts

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
      - name: Verify Supabase access token is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Verify DNU workflow token is configured
        env:
          DNU_WORKFLOW_TOKEN: ${{ secrets.DNU_WORKFLOW_TOKEN }}
        run: test -n "$DNU_WORKFLOW_TOKEN"
      - name: Store GitHub workflow token in Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DNU_WORKFLOW_TOKEN: ${{ secrets.DNU_WORKFLOW_TOKEN }}
        run: |
          secret_file="$(mktemp)"
          chmod 600 "$secret_file"
          printf 'GITHUB_WORKFLOW_TOKEN=%s\n' "$DNU_WORKFLOW_TOKEN" > "$secret_file"
          npx --yes supabase@3.1.0 secrets set --project-ref epghsyajgspcywqqbfso --env-file "$secret_file"
          rm -f "$secret_file"
      - name: Deploy editor-only trigger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@3.1.0 functions deploy start-dnu-collection --project-ref epghsyajgspcywqqbfso
