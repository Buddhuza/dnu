name: FEEDRUN direct publisher collection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/feedrun-request.json

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Fetch the last 24 hours from direct publisher feeds and article pages
        env:
          DIRECT_FEED_WINDOW_HOURS: '24'
          DIRECT_FEED_RESULT_PATH: data/feedrun-result.json
        run: node scripts/direct-feed-36h.mjs
      - name: Save the source audit and article text for editorial review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b feedrun-result-${{ github.run_id }}
          git add -f data/feedrun-result.json
          git commit -m "Save FEEDRUN direct publisher collection"
          git push origin HEAD:feedrun-result-${{ github.run_id }}
