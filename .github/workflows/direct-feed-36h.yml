name: Direct publisher feed 36-hour articles

on:
  push:
    paths:
      - scripts/direct-feed-36h.mjs
      - .github/workflows/direct-feed-36h.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/direct-feed-36h.mjs
      - name: Save article audit on a separate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b feed-run-36h-2026-10-31
          git add -f data/direct-feed-36h-result.json
          git commit -m "Save 36-hour publisher article audit"
          git push origin HEAD:feed-run-36h-2026-10-31
