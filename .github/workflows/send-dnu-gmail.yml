name: Send published DNU through Gmail
run-name: Send DNU ${{ inputs.request_id || github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - .github/dnu-email-trigger.txt
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Published edition revision to send
        required: true
        type: string
      headline_only:
        description: Send the compressed view
        required: true
        type: boolean
        default: false
      request_id:
        description: Request identifier for delivery status
        required: true
        type: string
      scheduled_delivery:
        description: Scheduled delivery dispatched by Supabase Cron
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: send-published-dnu-gmail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check Vienna slot and earlier delivery
        id: delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          SCHEDULED_DELIVERY: ${{ inputs.scheduled_delivery || 'false' }}
        run: node scripts/should-send-scheduled-gmail.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.delivery.outputs.send == 'true'
        with:
          node-version: '24.5.0'
          cache: npm
      - if: steps.delivery.outputs.send == 'true'
        run: npm ci
      - name: Verify delivery credentials
        if: steps.delivery.outputs.send == 'true'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: test -n "$GMAIL_APP_PASSWORD" && { test -n "$SUPABASE_SERVICE_ROLE_KEY" || test -n "$SUPABASE_ACCESS_TOKEN"; }
      - name: Render the published edition
        if: steps.delivery.outputs.send == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPECTED_REVISION: ${{ github.event_name != 'workflow_dispatch' && 'latest' || inputs.expected_revision }}
          HEADLINE_ONLY: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.scheduled_delivery && 'true' || inputs.headline_only && 'true' || 'false' }}
        run: node scripts/build-gmail-message.mjs "$EXPECTED_REVISION" "$HEADLINE_ONLY" "$RUNNER_TEMP/dnu-gmail-message.json"
      - name: Send from the situation room Gmail account
        if: steps.delivery.outputs.send == 'true'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/send-dnu-gmail.py "$RUNNER_TEMP/dnu-gmail-message.json"
